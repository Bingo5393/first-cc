<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pomodoro-theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番茄钟</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">番茄钟</h1>
    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" title="切换深浅色" aria-label="切换深浅色">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <nav class="mode-tabs" role="tablist">
    <button class="mode-tab active" data-mode="work">专注</button>
    <button class="mode-tab" data-mode="shortBreak">短休息</button>
    <button class="mode-tab" data-mode="longBreak">长休息</button>
  </nav>

  <main class="timer-stage">
    <div class="ring-wrap">
      <svg class="ring" width="300" height="300" viewBox="0 0 300 300">
        <circle class="ring-bg" cx="150" cy="150" r="132"></circle>
        <circle class="ring-progress" id="ring-progress" cx="150" cy="150" r="132"></circle>
      </svg>
      <div class="ring-center">
        <span id="time" class="time">25:00</span>
        <span id="mode-label" class="mode-label">专注</span>
      </div>
    </div>

    <div class="dots" id="dots" title="本轮完成的番茄数"></div>

    <div class="controls">
      <button id="start-pause" class="btn btn-primary">开始</button>
      <button id="reset" class="btn btn-secondary">重置</button>
    </div>
  </main>

  <div id="settings-overlay" class="overlay hidden">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>设置</h2>
        <button id="close-settings" class="icon-btn" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <label class="field">
        <span>专注时长（分钟）</span>
        <input type="number" id="set-work" min="1" max="120" step="1" />
      </label>
      <label class="field">
        <span>短休息时长（分钟）</span>
        <input type="number" id="set-short" min="1" max="60" step="1" />
      </label>
      <label class="field">
        <span>长休息时长（分钟）</span>
        <input type="number" id="set-long" min="1" max="120" step="1" />
      </label>
      <label class="field">
        <span>长休息间隔（几个番茄后）</span>
        <input type="number" id="set-interval" min="1" max="12" step="1" />
      </label>

      <div class="settings-actions">
        <button id="save-settings" class="btn btn-primary">保存</button>
        <button id="reset-defaults" class="btn btn-secondary">恢复默认</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
