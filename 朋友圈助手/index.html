<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>朋友圈助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部工具栏 -->
    <header class="topbar">
      <h1>📱 朋友圈助手</h1>
      <div class="topbar-right">
        <span id="adbStatus" class="status status-pending">检测手机连接…</span>
        <button id="btnNew" class="btn">＋ 新建文案</button>
      </div>
    </header>

    <div class="main">
      <!-- 左侧：文案库 -->
      <aside class="sidebar">
        <div class="search-box">
          <input id="searchInput" type="text" placeholder="🔍 搜索文案 / 标签…" />
        </div>
        <div class="chips" id="categoryChips"></div>
        <div class="list-head">
          <span>文案库</span>
          <span id="listCount" class="muted"></span>
        </div>
        <ul class="list" id="sentenceList"></ul>
      </aside>

      <!-- 右侧：编辑器 + 模板 -->
      <section class="editor">
        <div class="editor-head">
          <span id="editorTitle">新建文案</span>
          <div class="editor-actions">
            <button id="btnCopy" class="btn btn-primary">复制到电脑</button>
            <button id="btnCopyPhone" class="btn">复制到手机</button>
            <button id="btnPublish" class="btn btn-publish">📱 自动发布</button>
            <button id="btnSave" class="btn">保存</button>
            <button id="btnDelete" class="btn btn-danger">删除</button>
          </div>
        </div>

        <textarea id="contentInput" placeholder="在这里输入你的朋友圈文案…（可点击下方模板快速套用）"></textarea>

        <div class="meta-row">
          <label class="meta-field">
            <span>分类</span>
            <input id="categoryInput" type="text" placeholder="如：新品发布" />
          </label>
          <label class="meta-field">
            <span>标签</span>
            <input id="tagsInput" type="text" placeholder="用逗号分隔，如：优惠,新品" />
          </label>
        </div>

        <div class="templates">
          <h3>📋 内置模板</h3>
          <ul class="template-list" id="templateList"></ul>
        </div>
      </section>
    </div>

    <!-- 底部状态栏 -->
    <footer class="statusbar">
      <span id="dataPath" class="muted"></span>
      <span id="toast" class="toast"></span>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
