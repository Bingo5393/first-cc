# ============================================================
# 朋友圈转发助手 —— 配置文件
# 说明：监控指定好友的朋友圈，自动下载图文/视频并转发到自己朋友圈。
# ============================================================

# ---------- 监控目标 ----------
monitor:
  # 要监控的好友：填备注名 / 昵称 / wxid 均可（与微信里看到的名称一致）
  targets: []
  # 黑名单：即使出现在 targets 里也忽略的好友（用于临时排除）
  blacklist: []

# ---------- 转发设置 ----------
forward:
  prefix: ""            # 转发文案前缀（可为空）
  suffix: ""            # 转发文案后缀（可为空）

# ---------- 频率限制（防风控） ----------
rate_limit:
  max_per_hour: 5       # 每小时最多转发条数
  max_per_day: 20       # 每天最多转发条数
  random_delay_min: 3   # 每次转发前随机延迟下限（秒）
  random_delay_max: 8   # 每次转发前随机延迟上限（秒）

# ---------- 时段控制 ----------
time_control:
  enable: false         # 是否启用时段控制
  start_hour: 9         # 允许转发的开始小时（含）
  end_hour: 22          # 允许转发的结束小时（不含）

# ---------- 调度 ----------
schedule:
  poll_interval_minutes: 10   # 轮询间隔（分钟）
  time_window_minutes: 60     # 只处理该时间窗口内的新动态（避免重复拉全量）
  pyq_wait_seconds: 3         # refresh 后等待朋友圈消息推送的秒数（消息异步到达，实测可调）

# ---------- WeChatFerry 连接 ----------
wcf:
  host: ""              # 留空=本地模式（自动运行 wcf.exe 注入微信）；填 IP 则连接远程 wcf 服务
  port: 10086           # wcf 服务端口

# ---------- PC 微信发朋友圈坐标（相对微信主窗口客户区左上角） ----------
# 这些是占位值，需在虚拟机实测校准后填写（微信 3.9.x 默认窗口大小）。
publish_coords:
  moments_entry: [66, 122]      # 左侧导航「朋友圈」图标
  camera: [906, 56]             # 朋友圈页右上角「相机」图标（发图文）
  add_image: [120, 160]         # 发圈窗口「添加图片」区域
  text_input: [520, 420]        # 文字输入框
  publish_btn: [860, 600]       # 「发表」按钮

# ---------- 通知（可选，企业微信机器人） ----------
notify:
  enable: false
  webhook_url: ""       # 企业微信群机器人 webhook 地址
